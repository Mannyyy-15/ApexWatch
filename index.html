<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#050505" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>ApexWatch | Free HD Streaming</title>
  <link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />
  <link rel="apple-touch-icon" href="/logo.png" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <script>
    window.addEventListener('error', function(e) {
      document.body.innerHTML += '<div style="position:fixed;inset:0;z-index:999999;background:red;color:white;padding:20px;overflow:auto;word-wrap:break-word;"><h3>JS Error</h3><p>' + e.message + '</p><p>' + e.filename + ':' + e.lineno + '</p><pre>' + (e.error ? e.error.stack : '') + '</pre></div>';
    });
    window.addEventListener('unhandledrejection', function(e) {
      document.body.innerHTML += '<div style="position:fixed;inset:0;z-index:999999;background:red;color:white;padding:20px;overflow:auto;word-wrap:break-word;"><h3>Promise Error</h3><p>' + e.reason + '</p></div>';
    });
  </script>
</head>

<body>
  <div id="root">
    <style>
      * { box-sizing: border-box; }
      .app-loader-container {
        position: fixed; inset: 0; background-color: #030303;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        z-index: 99999; gap: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      /* Logo */
      .app-loader-logo {
        width: 72px; height: 72px; border-radius: 18px;
        box-shadow: 0 0 0 0 rgba(229,9,20,0.5);
        animation: logoBreath 2.4s ease-in-out infinite;
        margin-bottom: 28px;
      }
      @keyframes logoBreath {
        0%,100% { transform: scale(0.96); box-shadow: 0 0 18px rgba(229,9,20,0.25); }
        50%      { transform: scale(1.04); box-shadow: 0 0 48px rgba(229,9,20,0.55); }
      }
      /* Brand name */
      .app-loader-wordmark {
        display: flex; gap: 2px; margin-bottom: 20px;
        overflow: hidden;
      }
      .app-loader-wordmark span {
        display: inline-block;
        color: #fff;
        font-size: 13px;
        font-weight: 900;
        letter-spacing: 0.38em;
        text-transform: uppercase;
        opacity: 0;
        transform: translateY(10px);
        animation: letterIn 0.6s cubic-bezier(0.16,1,0.3,1) forwards;
      }
      .app-loader-wordmark span:nth-child(1)  { animation-delay: 0.10s; }
      .app-loader-wordmark span:nth-child(2)  { animation-delay: 0.15s; }
      .app-loader-wordmark span:nth-child(3)  { animation-delay: 0.20s; }
      .app-loader-wordmark span:nth-child(4)  { animation-delay: 0.25s; }
      .app-loader-wordmark span:nth-child(5)  { animation-delay: 0.30s; }
      .app-loader-wordmark span:nth-child(6)  { animation-delay: 0.35s; }
      .app-loader-wordmark span:nth-child(7)  { animation-delay: 0.40s; }
      .app-loader-wordmark span:nth-child(8)  { animation-delay: 0.45s; }
      .app-loader-wordmark span:nth-child(9)  { animation-delay: 0.50s; }
      @keyframes letterIn {
        to { opacity: 1; transform: translateY(0); }
      }
      /* Scanning bar */
      .app-loader-bar-wrap {
        width: 120px; height: 2px;
        background: rgba(255,255,255,0.06);
        border-radius: 99px;
        overflow: hidden;
        opacity: 0;
        animation: barAppear 0.4s 0.7s forwards;
      }
      .app-loader-bar {
        height: 100%; width: 40%;
        background: linear-gradient(90deg, transparent, #e50914, transparent);
        border-radius: 99px;
        animation: barScan 1.6s 0.7s ease-in-out infinite;
      }
      @keyframes barAppear { to { opacity: 1; } }
      @keyframes barScan {
        0%   { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
      }
    </style>
    <div class="app-loader-container">
      <img src="/logo.png" alt="ApexWatch" class="app-loader-logo" />
      <div class="app-loader-wordmark">
        <span>A</span><span>P</span><span>E</span><span>X</span><span>W</span><span>A</span><span>T</span><span>C</span><span>H</span>
      </div>
      <div class="app-loader-bar-wrap">
        <div class="app-loader-bar"></div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('SW Registered'))
          .catch(err => console.log('SW Failed', err));
      });
    }
  </script>
</body>

</html>
