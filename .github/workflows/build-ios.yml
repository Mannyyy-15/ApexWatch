name: 🍎 Build iOS IPA (Cloud)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-ios:
    name: Build iOS (Unsigned)
    runs-on: macos-latest

    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔑 Create .env file
        run: |
          echo "VITE_TMDB_API_KEY=${{ secrets.VITE_TMDB_API_KEY }}" >> .env
          echo "VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}" >> .env
          echo "VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}" >> .env
          echo "VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}" >> .env
          echo "VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}" >> .env
          echo "VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}" >> .env
          echo "VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}" >> .env
          echo "VITE_GEMINI_API_KEY=${{ secrets.VITE_GEMINI_API_KEY }}" >> .env

      - name: 🏗️ Build Web App
        run: npm run build

      - name: 🔄 Sync Capacitor to iOS
        run: npx cap sync ios

      - name: 🔍 List available schemes
        working-directory: ios/App
        run: xcodebuild -list -project App.xcodeproj

      - name: 🔧 Resolve Swift Package Manager dependencies
        working-directory: ios/App
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project App.xcodeproj \
            -scheme App \
            -clonedSourcePackagesDirPath ./spm-packages

      - name: 🔨 Build iOS for Simulator (No Signing)
        working-directory: ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -configuration Debug \
            -derivedDataPath ./build \
            -clonedSourcePackagesDirPath ./spm-packages \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build | xcpretty || true

      - name: 📦 Package .app as unsigned IPA
        run: |
          APP_PATH=$(find ios/App/build -name "*.app" -not -path "*/PackageFrameworks/*" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ No .app found. Listing build output:"
            find ios/App/build -type f -name "*.app" || true
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          mkdir -p ios/ipa-output/Payload
          cp -r "$APP_PATH" ios/ipa-output/Payload/
          cd ios/ipa-output
          zip -r ApexWatch-unsigned.ipa Payload/
          echo "✅ IPA created"
          ls -lh ApexWatch-unsigned.ipa

      - name: 📤 Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ApexWatch-ios-unsigned-ipa
          path: ios/ipa-output/ApexWatch-unsigned.ipa
          retention-days: 30

      - name: 🎉 Summary
        run: |
          echo "## ✅ iOS Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "📦 Download the IPA from the **Artifacts** section above." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📲 Install on iPhone" >> $GITHUB_STEP_SUMMARY
          echo "Use **AltStore** (free) to sideload the unsigned IPA onto your device." >> $GITHUB_STEP_SUMMARY
          echo "No Apple Developer account required." >> $GITHUB_STEP_SUMMARY
