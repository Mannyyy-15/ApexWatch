<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#050505" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>ApexWatch | Free HD Streaming</title>
  <link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />
  <link rel="apple-touch-icon" href="/logo.png" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <script type="module" crossorigin src="/assets/index-BmIk1_ub.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-D1wsokPa.css">
</head>

<body>
  <div id="root">
    <style>
      .app-loader-container {
        position: fixed; inset: 0; background-color: #050505; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 99999;
      }
      .app-loader-logo {
        width: 80px; height: 80px; border-radius: 20px; box-shadow: 0 0 40px rgba(229, 9, 20, 0.4); animation: pulse 2s infinite ease-in-out; margin-bottom: 24px;
      }
      .app-loader-spinner {
        width: 40px; height: 40px; border: 3px solid rgba(255, 255, 255, 0.1); border-top-color: #e50914; border-radius: 50%; animation: spin 1s infinite linear;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes pulse { 
        0% { transform: scale(0.95); box-shadow: 0 0 20px rgba(229, 9, 20, 0.2); } 
        50% { transform: scale(1.05); box-shadow: 0 0 50px rgba(229, 9, 20, 0.6); } 
        100% { transform: scale(0.95); box-shadow: 0 0 20px rgba(229, 9, 20, 0.2); } 
      }
    </style>
    <div class="app-loader-container">
      <img src="/logo.png" alt="ApexWatch Logo" class="app-loader-logo" />
      <div class="app-loader-spinner"></div>
    </div>
  </div>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('SW Registered'))
          .catch(err => console.log('SW Failed', err));
      });
    }
  </script>
</body>

</html>
